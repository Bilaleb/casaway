<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Explore Casablanca grand taxi and petit taxi depots and route traces with Casaway."
    />
    <meta property="og:title" content="Casaway - Your Way Through Casablanca" />
    <meta
      property="og:description"
      content="Explore Casablanca grand taxi and petit taxi depots and route traces with Casaway."
    />
    <meta name="theme-color" content="#f2f9fd" />
    <meta name="color-scheme" content="light" />
    <script>
      // Ocean light is the default look; dark stays available via the toggle.
      (function () {
        try {
          var saved = localStorage.getItem('casaway-theme');
          var theme = saved === 'dark' ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'light' ? '#f2f9fd' : '#0b1620');
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Casaway" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Casaway - Your Way Through Casablanca</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
